        .word-en { font-size: 2.0rem; font-weight: 600; color: #0f3b5e; font-family: 'Georgia', serif; }
        .hint { color: #6f7d98; font-size: 0.85rem; margin: 6px 0; }

        .example-en { font-size: 1.0rem; color: #0b2b4a; font-style: italic; }
        .example-zh { font-size: 0.9rem; color: #4d627a; margin-top: 3px; }

        .opt-btn { padding: 12px 8px; background: #f2f6fd; border: 1.5px solid #d7e0ed; border-radius: 60px; font-size: 0.95rem; font-weight: 500; color: #1a2d44; cursor: pointer; transition: 0.1s; }
        .opt-btn:hover { background: #e6eefa; }

        .opt-btn.wrong { background: #f8d7da; border-color: #b33c3c; color: #7a2a2a; }

        .audio-btn { background: #eef3fc; border: none; padding: 9px 20px; border-radius: 60px; font-size: 0.95rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.1s; }

        .audio-btn.example { color: #8a2e5a; }

</head>
<body>
<div class="container">

        <button class="mode-tab" data-mode="audio2word">🔊 听音选词</button>
    </div>

    <div class="card" id="cardMain">

        <div id="extraArea"></div>
    </div>

    <div class="action-row">

        <button class="action-btn" id="shuffleBtn">🔀 打乱</button>

        <div id="wordlistTable"></div>
    </div>
</div>

// ======================== 间隔重复核心 ========================
const STORAGE_KEY = 'nce_spaced_repetition_v1';
const INTERVALS = {
    WRONG: 25 * 60 * 1000,
    CORRECT_1: 24 * 60 * 60 * 1000,
    CORRECT_2: 3 * 24 * 60 * 60 * 1000,
    CORRECT_3: 7 * 24 * 60 * 60 * 1000
};

function now() { return Date.now(); }

function loadProgress() {
    try { const data = localStorage.getItem(STORAGE_KEY); return data ? JSON.parse(data) : {}; } catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

function getWordState(word) {
    const progress = loadProgress();
    return progress[word] || { correctCount: 0, lastSeen: 0, nextReview: 0, mastered: false, totalCorrect: 0, totalWrong: 0 };
}

function updateWordState(word, isCorrect) {
    const progress = loadProgress();
    if (!progress[word]) progress[word] = { correctCount: 0, lastSeen: 0, nextReview: 0, mastered: false, totalCorrect: 0, totalWrong: 0 };
    const state = progress[word];
    const currentTime = now();
    if (isCorrect) {
        state.totalCorrect++;
        state.correctCount++;
        if (state.correctCount >= 4) {
            state.mastered = true;
            state.nextReview = Infinity;
        } else {
            let delay;
            if (state.correctCount === 1) delay = INTERVALS.CORRECT_1;
            else if (state.correctCount === 2) delay = INTERVALS.CORRECT_2;
            else if (state.correctCount === 3) delay = INTERVALS.CORRECT_3;
            else delay = INTERVALS.CORRECT_1;
            state.nextReview = currentTime + delay;
        }
    } else {
        state.totalWrong++;
        state.correctCount = 0;
        state.nextReview = currentTime + INTERVALS.WRONG;
        state.mastered = false;
    }
    state.lastSeen = currentTime;
    saveProgress(progress);
    return state;
}

function getDueWords(allWords) {
    const progress = loadProgress();
    const currentTime = now();
    const due = [], learning = [], mastered = [];
    allWords.forEach(w => {
        const state = progress[w.en] || { correctCount: 0, lastSeen: 0, nextReview: 0, mastered: false };
        if (state.mastered) mastered.push(w.en);
        else if (state.nextReview <= currentTime) due.push(w.en);
        else learning.push(w.en);
    });
    return { due, learning, mastered };
}

function updateVoiceStatus(ready) {
    voiceReady = ready;
    if (ready) {
        voiceStatusEl.style.display = 'none';
    } else {
        voiceStatusEl.style.display = 'inline-block';
        voiceStatusEl.textContent = '🔊 正在加载语音引擎...';
        voiceStatusEl.className = 'voice-status loading';
    }
}

// 强制激活语音：在用户首次点击时尝试加载语音并播放一个空音频以激活
function forceActivateSpeech() {
    if (voiceReady) return;
    if (!window.speechSynthesis) return;
    try {
        // 获取语音列表
        const voices = speechSynthesis.getVoices();
        if (voices && voices.length > 0) {
            updateVoiceStatus(true);
            return;
        }
        // 如果还是没有语音，尝试播放一个极短的静音来激活
        const utterance = new SpeechSynthesisUtterance(' ');
        utterance.lang = 'en-US';
        utterance.volume = 0;
        speechSynthesis.speak(utterance);
        setTimeout(() => {
            const v = speechSynthesis.getVoices();
            if (v && v.length > 0) updateVoiceStatus(true);
        }, 200);
    } catch (e) {
        console.warn('语音激活失败:', e);
    }
}

function initSpeech() {
    if (!window.speechSynthesis) {
        voiceStatusEl.style.display = 'none';
        return;
    }
    const tryLoadVoices = () => {
        const voices = speechSynthesis.getVoices();
        if (voices && voices.length > 0) { updateVoiceStatus(true); return true; }
        return false;
    };
    if (tryLoadVoices()) return;
    speechSynthesis.onvoiceschanged = function() {
        if (tryLoadVoices()) speechSynthesis.onvoiceschanged = null;
    };
    // 延时重试
    setTimeout(() => {
        const voices = speechSynthesis.getVoices();
        if (voices && voices.length > 0) updateVoiceStatus(true);
        else {
            voiceReady = false;
            voiceStatusEl.style.display = 'inline-block';
            voiceStatusEl.textContent = '🔊 请点击任意位置激活语音';
            voiceStatusEl.className = 'voice-status loading';
            // 点击页面任意位置尝试激活
            document.addEventListener('click', function initOnClick() {
                forceActivateSpeech();
                if (voiceReady) {
                    document.removeEventListener('click', initOnClick);
                }
            }, { once: false });
        }
    }, 3000);
}

const allWords = RAW_WORDS;

function loadWords() {
    const { due, learning, mastered } = getDueWords(allWords);
    let activeWords = [...due, ...learning];
    if (activeWords.length === 0) {
        activeWords = allWords.filter(w => {
            const state = loadProgress()[w.en];
            return !state || !state.mastered;
        }).map(w => w.en);
    }
    if (activeWords.length === 0) {
        shuffled = [];
        stats = { correct: 0, wrong: 0, total: 0 };
        currentIndex = 0; answered = false;
        render(); updateStat(); renderWordList(); updateProgressBar();
        return;
    }
    const progress = loadProgress();
    activeWords.sort((a, b) => {
        const sa = progress[a] || { nextReview: 0, mastered: false };
        const sb = progress[b] || { nextReview: 0, mastered: false };
        const aDue = sa.nextReview <= now();
        const bDue = sb.nextReview <= now();
        if (aDue && !bDue) return -1;
        if (!aDue && bDue) return 1;
        return (sa.nextReview || 0) - (sb.nextReview || 0);
    });
    const wordDataMap = {};
    allWords.forEach(w => { wordDataMap[w.en] = w; });
    shuffled = activeWords.map(en => wordDataMap[en]).filter(w => w);
    stats = { correct: 0, wrong: 0, total: 0 };
    currentIndex = 0; answered = false;
    render(); updateStat(); renderWordList(); updateProgressBar();
}

function getCurrentItem() {
    if (shuffled.length === 0) return null;
    return shuffled[currentIndex % shuffled.length];
}

function handleAnswer(item, isCorrect) {
    if (answered) return;
    answered = true;
    stats.total++;
    if (isCorrect) stats.correct++; else stats.wrong++;
    updateWordState(item.en, isCorrect);
    const oldStats = { ...stats };
    loadWords();
    stats = oldStats;
    render(); updateStat(); renderWordList(); updateProgressBar();
    if (shuffled.length > 0) {
        const found = shuffled.some(w => w.en === item.en);
        if (!found) currentIndex = 0;
        else {
            const newIndex = shuffled.findIndex(w => w.en === item.en);
            if (newIndex >= 0) currentIndex = newIndex;
        }
        render();
    }
}

// ======================== 语音 ========================
function speak(text) {
    if (!text) return;
    // 如果语音未就绪，尝试激活
    if (!voiceReady) {
        forceActivateSpeech();
        // 如果还是没有就绪，提示用户点击
        if (!voiceReady) {
            voiceStatusEl.style.display = 'inline-block';
            voiceStatusEl.textContent = '⚠️ 请点击页面任意位置激活语音';
            voiceStatusEl.className = 'voice-status loading';
            return;
        }
    }
    try {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const male = voices.filter(v => v.lang.startsWith('en') && /male/i.test(v.name));
        if (male.length > 0) utterance.voice = male[0];
        else {
            const enVoice = voices.find(v => v.lang.startsWith('en'));
            if (enVoice) utterance.voice = enVoice;
        }
        window.speechSynthesis.speak(utterance);
    } catch (e) { console.warn('语音播放失败:', e); }
}

function speakCardWord() {
    const item = getCurrentItem();
    if (item) speak(item.en);
}

function speakCardExample() {
    const item = getCurrentItem();
    if (item && item.example) speak(item.example);
    else if (item) speak(item.en);
}

function speakCurrentWord() {
    const item = getCurrentItem();
    if (item) speak(item.en);
}

function render() {
    const container = document.getElementById('cardContent');
    const extra = document.getElementById('extraArea');
    extra.innerHTML = '';
    const item = getCurrentItem();
    currentItem = item;
    if (!item) {
        container.innerHTML = `<div style="color:#6f7d98;">🎉 所有单词已掌握！</div>`;
        return;
    }
    const state = getWordState(item.en);
    let statusMsg = '';
    if (state.mastered) statusMsg = '✅ 已掌握';
    else if (state.correctCount > 0) {
        const intervals = ['', '1天', '3天', '7天'];
        const next = state.correctCount < 4 ? intervals[state.correctCount] || '' : '';
        statusMsg = `📈 连续答对 ${state.correctCount} 次 · 下次复习 ${next}`;
    }
    const mode = currentMode;
    let html = '';
    const lessonBadge = `<span class="lesson-badge">${item.lesson}</span>`;
    
    if (mode === 'card') {
        html = `<div>${lessonBadge}</div>`;
        html += `<div class="word-big">${item.en}</div>`;
        if (item.ipa) html += `<div class="word-ipa">${item.ipa}</div>`;
        const posDisplay = item.pos ? `<span class="pos-badge">${item.pos}</span>` : '';
        html += `<div class="word-zh" style="font-size:1.8rem; margin-top:4px;">${item.zh} ${posDisplay}</div>`;
        if (item.example) {
            html += `<div class="example-box"><div class="example-en">💬 ${item.example}</div></div>`;
        }
        if (statusMsg) html += `<div style="font-size:0.85rem; color:#6f7d98; margin-top:6px;">${statusMsg}</div>`;
        html += `<div class="audio-pair" style="margin-top:10px;">
            <button class="audio-btn word" onclick="speakCardWord()">🔊 词汇发音</button>
            ${item.example ? `<button class="audio-btn example" onclick="speakCardExample()">📖 例句发音</button>` : ''}
        </div>`;
        html += `<div style="font-size:0.8rem; color:#9aa8b9; margin-top:8px;">💡 点击「下一题」浏览下一个单词</div>`;
        container.innerHTML = html;
        return;
    }
    
    if (mode === 'en2zh') {
        html = `<div>${lessonBadge}</div><div class="word-big">${item.en}</div>${item.ipa ? `<div class="word-ipa">${item.ipa}</div>` : ''}`;
        if (statusMsg) html += `<div class="hint">${statusMsg}</div>`;
        html += `<div class="hint">选择正确的中文释义</div>`;
        const opts = generateOptions(item, 'zh');
        html += `<div class="options">${opts.map(o => `<button class="opt-btn" data-word="${o.en}" data-zh="${o.zh}">${o.zh}</button>`).join('')}</div>`;
        container.innerHTML = html;
        attachOptionListeners(item, 'zh');
    } else if (mode === 'zh2en') {
        html = `<div>${lessonBadge}</div><div class="word-zh">${item.zh}</div>`;
        if (statusMsg) html += `<div class="hint">${statusMsg}</div>`;
        html += `<div class="hint">输入对应的英文</div>`;
        if (item.ipa) html += `<div class="small-ipa" style="margin:4px 0;">💡 音标: ${item.ipa}</div>`;
        html += `<div class="input-area"><input type="text" id="answerInput" placeholder="输入英文..." autocomplete="off"><button id="submitAnswer">确认</button></div>`;
        container.innerHTML = html;
        document.getElementById('submitAnswer').addEventListener('click', () => checkZh2En(item));
        document.getElementById('answerInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') checkZh2En(item); });
    } else if (mode === 'listen') {
        html = `<div>${lessonBadge}</div><div class="word-big">🎧 听音拼写</div>`;
        if (statusMsg) html += `<div class="hint">${statusMsg}</div>`;
        html += `<div class="hint">点击下方播放音频，然后拼写单词</div>`;
        html += `<div class="audio-group"><button class="audio-btn word" onclick="speakCurrentWord()">🔊 播放单词</button></div>`;
        if (item.ipa) html += `<div class="small-ipa" style="margin:6px 0;">🔊 音标: ${item.ipa}</div>`;
        html += `<div class="input-area"><input type="text" id="listenInput" placeholder="拼写英文..." autocomplete="off"><button id="submitListen">确认</button></div>`;
        container.innerHTML = html;
        document.getElementById('submitListen').addEventListener('click', () => checkListen(item));
        document.getElementById('listenInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') checkListen(item); });
    } else if (mode === 'audio2word') {
        html = `<div>${lessonBadge}</div><div class="word-big">🔊 听音选词</div>`;
        if (statusMsg) html += `<div class="hint">${statusMsg}</div>`;
        html += `<div class="hint">点击播放，然后选择正确的单词</div>`;
        html += `<div class="audio-group"><button class="audio-btn word" onclick="speakCurrentWord()">🔊 播放单词</button></div>`;
        const opts = generateOptions(item, 'en');
        html += `<div class="options">${opts.map(o => `<button class="opt-btn" data-word="${o.en}" data-zh="${o.zh}">${o.en}</button>`).join('')}</div>`;
        container.innerHTML = html;
        attachOptionListeners(item, 'en');
    }
}

function generateOptions(item, type) {
    let pool = shuffled.filter(w => w.en !== item.en);
    pool = shuffleArray(pool).slice(0, 3);
    let options = [item, ...pool];
    if (type === 'zh') options = shuffleArray(options.map(w => ({ en: w.en, zh: w.zh })));
    else options = shuffleArray(options.map(w => ({ en: w.en, zh: w.zh })));
    return options;
}

function shuffleArray(arr) { for (let i = arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function attachOptionListeners(item, type) {
    document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (answered) return;
            const selected = type === 'zh' ? this.dataset.zh : this.dataset.word;
            const correct = type === 'zh' ? item.zh : item.en;
            const isCorrect = selected === correct;
            this.classList.add(isCorrect ? 'correct' : 'wrong');
            if (!isCorrect) {
                document.querySelectorAll('.opt-btn').forEach(b => {
                    const val = type === 'zh' ? b.dataset.zh : b.dataset.word;
                    if (val === correct) b.classList.add('correct');
                });
            }
            handleAnswer(item, isCorrect);
        });
    });
}

function checkZh2En(item) {
    if (answered) return;
    const input = document.getElementById('answerInput');
    const val = input.value.trim().toLowerCase();
    const correct = item.en.toLowerCase();
    const isCorrect = val === correct;
    document.getElementById('extraArea').innerHTML = `<div style="font-size:1.2rem; margin-top:8px;">${isCorrect ? '✅ 正确！' : '❌ 错误，正确答案: ' + item.en}</div>`;
    handleAnswer(item, isCorrect);
}

function checkListen(item) {
    if (answered) return;
    const input = document.getElementById('listenInput');
    const val = input.value.trim().toLowerCase();
    const correct = item.en.toLowerCase();
    const isCorrect = val === correct;
    document.getElementById('extraArea').innerHTML = `<div style="font-size:1.2rem; margin-top:8px;">${isCorrect ? '✅ 拼写正确！' : '❌ 错误，正确拼写: ' + item.en}</div>`;
    handleAnswer(item, isCorrect);
}

function nextQuestion() {
    if (shuffled.length === 0) return;
    if (currentMode === 'card') {
        currentIndex = (currentIndex + 1) % shuffled.length;
        answered = false;
        render();
        document.getElementById('extraArea').innerHTML = '';
        return;
    }
    loadWords();
    if (currentIndex >= shuffled.length) currentIndex = 0;
    answered = false;
    render();
    document.getElementById('extraArea').innerHTML = '';
    updateStat();
}

function updateStat() {
    document.getElementById('correctNum').textContent = stats.correct;
    document.getElementById('wrongNum').textContent = stats.wrong;
    const total = stats.total || 1;
    document.getElementById('rateNum').textContent = Math.round((stats.correct / total) * 100) + '%';
    const remain = shuffled.length - (stats.correct + stats.wrong);
    document.getElementById('remainNum').textContent = remain > 0 ? remain : 0;
}

function updateProgressBar() {
    const progress = loadProgress();
    let mastered = 0, learning = 0, unlearned = 0;
    const currentTime = now();
    allWords.forEach(w => {
        const p = progress[w.en];
        if (p && p.mastered) mastered++;
        else if (p && p.nextReview > currentTime) learning++;
        else unlearned++;
    });
    document.getElementById('masteredCount').textContent = mastered;
    document.getElementById('learningCount').textContent = learning;
    document.getElementById('unlearnedCount').textContent = unlearned;
    document.getElementById('saveStatus').textContent = '💾 已自动保存';
}

function renderWordList() {
    const table = document.getElementById('wordlistTable');
    const progress = loadProgress();
    const currentTime = now();
    let html = `<table>`;
    allWords.forEach(w => {
        const p = progress[w.en] || { mastered: false, correctCount: 0, nextReview: 0 };
        let dot, color, label;
        if (p.mastered) { dot = '●'; color = '#1a6b3a'; label = '已掌握'; }
        else if (p.nextReview <= currentTime) { dot = '●'; color = '#e68a2e'; label = '待复习'; }
        else { dot = '○'; color = '#c0c8d6'; label = '学习中'; }
        const lessonTag = `<span class="lesson-tag">${w.lesson}</span>`;
        const intervalLabel = p.correctCount > 0 && !p.mastered ? ` (${p.correctCount}/4)` : '';
        html += `<tr><td class="en">${w.en}</td><td class="ipa">${w.ipa || ''}</td><td class="zh">${lessonTag}${w.zh}</td><td style="text-align:center;color:${color};font-size:0.8rem;">${dot} ${label}${intervalLabel}</td></tr>`;
    });
    html += `</table>`;
    table.innerHTML = html;
}

// ======================== 初始化 ========================
function initModeTabs() {
    document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.mode;
            answered = false;
            if (currentMode !== 'card') {
                loadWords();
            }
            render();
            document.getElementById('extraArea').innerHTML = '';
        });
    });
    document.querySelector('.mode-tab[data-mode="card"]')?.classList.add('active');
}

document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('shuffleBtn').addEventListener('click', function() {
    if (shuffled.length > 0) {
        shuffled = shuffleArray([...shuffled]);
        currentIndex = 0;
        stats = { correct: 0, wrong: 0, total: 0 };
        answered = false;
        render();
        updateStat();
    }
});
document.getElementById('resetAllBtn').addEventListener('click', function() {
    if (!confirm('⚠️ 确定要删除所有学习进度吗？此操作不可撤销！')) return;
    localStorage.removeItem(STORAGE_KEY);
    loadWords();
});

initSpeech();
loadWords();
initModeTabs();

// 全局点击激活语音
document.addEventListener('click', function() {
    forceActivateSpeech();
});
</script>
