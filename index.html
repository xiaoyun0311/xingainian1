// ======================== 进度存储 ========================
const STORAGE_KEY = 'nep_progress_v4';

function loadProgress() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : {};
    } catch { return {}; }
}

function saveProgress(progress) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function getWordProgress(word) {
    const progress = loadProgress();
    return progress[word] || { correct: 0, wrong: 0, mastered: false };
}

function updateWordProgress(word, isCorrect) {
    const progress = loadProgress();
    if (!progress[word]) progress[word] = { correct: 0, wrong: 0, mastered: false };
    if (isCorrect) progress[word].correct++;
    else progress[word].wrong++;
    const total = progress[word].correct + progress[word].wrong;
    const rate = total > 0 ? progress[word].correct / total : 0;
    progress[word].mastered = (total >= 3 && rate >= 0.8);
    saveProgress(progress);
    return progress[word];
}

// ======================== 核心逻辑 ========================
let currentLesson = 1;
let currentMode = 'en2zh';
let wordList = [];
let currentIndex = 0;
let shuffled = [];
let stats = { correct: 0, wrong: 0, total: 0 };
let answered = false;
let currentItem = null;

function getWordsForLesson(lesson) {
    const raw = RAW_LESSONS[lesson] || [];
    return raw.map(w => {
        const en = w.trim();
        const example = EXAMPLE_MAP[en] || ["", ""];
        return { 
            en, 
            zh: MEANINGS[en] || en,
            pos: POS_MAP[en] || '',
            ipa: IPA_MAP[en] || '',
            exampleEn: example[0],
            exampleZh: example[1]
        };
    });
}

function loadLesson(lesson) {
    currentLesson = lesson;
    const words = getWordsForLesson(lesson);
    wordList = words.filter(w => w.zh && w.zh.length > 0);
    if (wordList.length === 0) wordList = words.map(w => ({ ...w, zh: w.en }));
    const progress = loadProgress();
    wordList.sort((a, b) => {
        const pa = progress[a.en] || { mastered: false, correct: 0 };
        const pb = progress[b.en] || { mastered: false, correct: 0 };
        if (pa.mastered && !pb.mastered) return 1;
        if (!pa.mastered && pb.mastered) return -1;
        return (pa.correct || 0) - (pb.correct || 0);
    });
    shuffled = [...wordList];
    stats = { correct: 0, wrong: 0, total: 0 };
    currentIndex = 0;
    answered = false;
    render();
    updateStat();
    renderWordList();
    updateProgressBar();
    updateLessonDots();
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function getCurrentItem() {
    if (shuffled.length === 0) return null;
    return shuffled[currentIndex % shuffled.length];
}

// 通用发音函数
function speak(text, accent = 'US') {
    if (!text) return;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = accent === 'US' ? 'en-US' : 'en-GB';
    utterance.rate = 0.85;
    const voices = speechSynthesis.getVoices();
    const male = voices.filter(v => v.lang.startsWith('en') && /male/i.test(v.name));
    if (male.length > 0) utterance.voice = male[0];
    speechSynthesis.speak(utterance);
}

// 其他模式：播放单词
function speakCurrentWord(accent) {
    const item = getCurrentItem();
    if (item) speak(item.en, accent);
}

// 单词卡模式：播放例句
function speakCurrentExample(accent) {
    const item = getCurrentItem();
    if (item && item.exampleEn) {
        speak(item.exampleEn, accent);
    } else if (item) {
        // 如果没有例句，fallback 到单词本身
        speak(item.en, accent);
    }
}

function renderExampleBox(item) {
    if (currentMode !== 'card') return '';
    if (!item.exampleEn || !item.exampleZh) return '';
    return `
        <div class="example-box">
            <div class="example-en">💬 ${item.exampleEn}</div>
            <div class="example-zh">📖 ${item.exampleZh}</div>
        </div>
    `;
}

function render() {
    const container = document.getElementById('cardContent');
    const extra = document.getElementById('extraArea');
    extra.innerHTML = '';
    const item = getCurrentItem();
    currentItem = item;
    if (!item) { container.innerHTML = `<div style="color:#6f7d98;">🎉 所有单词已完成！</div>`; return; }

    const mode = currentMode;
    let html = '';
    if (mode === 'en2zh') {
        html = `<div class="word-big">${item.en}</div>`;
        if (item.ipa) html += `<div class="word-ipa">${item.ipa}</div>`;
        html += `<div class="hint">选择正确的中文释义</div>`;
        const opts = generateOptions(item, 'zh');
        html += `<div class="options">${opts.map(o => `<button class="opt-btn" data-word="${o.en}" data-zh="${o.zh}">${o.zh}</button>`).join('')}</div>`;
        container.innerHTML = html;
        attachOptionListeners(item, 'zh');
    } else if (mode === 'zh2en') {
        html = `<div class="word-zh">${item.zh}</div>`;
        html += `<div class="hint">输入对应的英文</div>`;
        if (item.ipa) html += `<div class="small-ipa" style="margin:4px 0;">💡 音标: ${item.ipa}</div>`;
        html += `<div class="input-area"><input type="text" id="answerInput" placeholder="输入英文..." autocomplete="off"><button id="submitAnswer">确认</button></div>`;
        container.innerHTML = html;
        document.getElementById('submitAnswer').addEventListener('click', () => checkZh2En(item));
        document.getElementById('answerInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') checkZh2En(item); });
    } else if (mode === 'listen') {
        html = `<div class="word-big">🎧 听音拼写</div><div class="hint">点击下方播放音频，然后拼写单词</div>`;
        html += `<div class="audio-group"><button class="audio-btn us" onclick="speakCurrentWord('US')">🇺🇸 美式男声</button><button class="audio-btn uk" onclick="speakCurrentWord('UK')">🇬🇧 英式男声</button></div>`;
        if (item.ipa) html += `<div class="small-ipa" style="margin:6px 0;">🔊 音标: ${item.ipa}</div>`;
        html += `<div class="input-area"><input type="text" id="listenInput" placeholder="拼写英文..." autocomplete="off"><button id="submitListen">确认</button></div>`;
        container.innerHTML = html;
        document.getElementById('submitListen').addEventListener('click', () => checkListen(item));
        document.getElementById('listenInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') checkListen(item); });
    } else if (mode === 'audio2word') {
        html = `<div class="word-big">🔊 听音选词</div><div class="hint">点击播放，然后选择正确的单词</div>`;
        html += `<div class="audio-group"><button class="audio-btn us" onclick="speakCurrentWord('US')">🇺🇸 播放</button></div>`;
        const opts = generateOptions(item, 'en');
        html += `<div class="options">${opts.map(o => `<button class="opt-btn" data-word="${o.en}" data-zh="${o.zh}">${o.en}</button>`).join('')}</div>`;
        container.innerHTML = html;
        attachOptionListeners(item, 'en');
    } else if (mode === 'card') {
        // 单词卡模式：显示词性 + 例句，音频播放例句
        html = `<div class="word-big">${item.en}</div>`;
        if (item.ipa) html += `<div class="word-ipa">${item.ipa}</div>`;
        const posDisplay = item.pos ? `<span class="pos-badge">${item.pos}</span>` : '';
        html += `<div class="word-zh" style="font-size:1.8rem; margin-top:4px;">${item.zh} ${posDisplay}</div>`;
        html += renderExampleBox(item);
        const prog = getWordProgress(item.en);
        const statusText = prog.mastered ? '✅ 已掌握' : (prog.correct + prog.wrong > 0 ? '📖 学习中' : '📝 未学习');
        html += `<div style="font-size:0.85rem; color:#6f7d98; margin-top:6px;">${statusText} · 正确 ${prog.correct} 次 · 错误 ${prog.wrong} 次</div>`;
        // 音频按钮播放例句
        html += `<div class="audio-group" style="margin-top:10px;">
            <button class="audio-btn us" onclick="speakCurrentExample('US')">🇺🇸 美式例句</button>
            <button class="audio-btn uk" onclick="speakCurrentExample('UK')">🇬🇧 英式例句</button>
        </div>`;
        container.innerHTML = html;
    }
}

function generateOptions(item, type) {
    let pool = shuffled.filter(w => w.en !== item.en);
    pool = shuffleArray(pool).slice(0, 3);
    let options = [item, ...pool];
    if (type === 'zh') {
        options = shuffleArray(options.map(w => ({ en: w.en, zh: w.zh })));
    } else {
        options = shuffleArray(options.map(w => ({ en: w.en, zh: w.zh })));
    }
    return options;
}

function handleAnswer(item, isCorrect) {
    if (answered) return;
    answered = true;
    stats.total++;
    if (isCorrect) stats.correct++; else stats.wrong++;
    updateWordProgress(item.en, isCorrect);
    updateStat();
    updateProgressBar();
    updateLessonDots();
    renderWordList();
}

function attachOptionListeners(item, type) {
    document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (answered) return;
            const selected = type === 'zh' ? this.dataset.zh : this.dataset.word;
            const correct = type === 'zh' ? item.zh : item.en;
            const isCorrect = selected === correct;
            this.classList.add(isCorrect ? 'correct' : 'wrong');
            if (!isCorrect) {
                document.querySelectorAll('.opt-btn').forEach(b => {
                    const val = type === 'zh' ? b.dataset.zh : b.dataset.word;
                    if (val === correct) b.classList.add('correct');
                });
            }
            handleAnswer(item, isCorrect);
            setTimeout(() => { nextQuestion(); }, 1000);
        });
    });
}

function checkZh2En(item) {
    if (answered) return;
    const input = document.getElementById('answerInput');
    const val = input.value.trim().toLowerCase();
    const correct = item.en.toLowerCase();
    const isCorrect = val === correct;
    handleAnswer(item, isCorrect);
    const area = document.getElementById('extraArea');
    area.innerHTML = `<div style="font-size:1.2rem; margin-top:8px;">${isCorrect ? '✅ 正确！' : '❌ 错误，正确答案: ' + item.en}</div>`;
    setTimeout(() => { nextQuestion(); }, 1200);
}

function checkListen(item) {
    if (answered) return;
    const input = document.getElementById('listenInput');
    const val = input.value.trim().toLowerCase();
    const correct = item.en.toLowerCase();
    const isCorrect = val === correct;
    handleAnswer(item, isCorrect);
    const area = document.getElementById('extraArea');
    area.innerHTML = `<div style="font-size:1.2rem; margin-top:8px;">${isCorrect ? '✅ 拼写正确！' : '❌ 错误，正确拼写: ' + item.en}</div>`;
    setTimeout(() => { nextQuestion(); }, 1200);
}

function nextQuestion() {
    if (shuffled.length === 0) return;
    currentIndex = (currentIndex + 1) % shuffled.length;
    answered = false;
    render();
    document.getElementById('extraArea').innerHTML = '';
    updateStat();
}

function updateStat() {
    document.getElementById('correctNum').textContent = stats.correct;
    document.getElementById('wrongNum').textContent = stats.wrong;
    const total = stats.total || 1;
    document.getElementById('rateNum').textContent = Math.round((stats.correct / total) * 100) + '%';
    const remain = shuffled.length - (stats.correct + stats.wrong);
    document.getElementById('remainNum').textContent = remain > 0 ? remain : 0;
}

function updateProgressBar() {
    const progress = loadProgress();
    let mastered = 0, learning = 0, unlearned = 0;
    const allWords = new Set();
    Object.keys(RAW_LESSONS).forEach(key => {
        RAW_LESSONS[key].forEach(w => allWords.add(w.trim()));
    });
    allWords.forEach(w => {
        const p = progress[w];
        if (p && p.mastered) mastered++;
        else if (p && (p.correct + p.wrong) > 0) learning++;
        else unlearned++;
    });
    document.getElementById('masteredCount').textContent = mastered;
    document.getElementById('learningCount').textContent = learning;
    document.getElementById('unlearnedCount').textContent = unlearned;
    document.getElementById('saveStatus').textContent = '💾 已自动保存';
}

function updateLessonDots() {
    const progress = loadProgress();
    document.querySelectorAll('.lesson-btn').forEach(btn => {
        const lesson = parseInt(btn.dataset.lesson);
        const words = RAW_LESSONS[lesson] || [];
        let mastered = 0, total = words.length;
        words.forEach(w => {
            const p = progress[w.trim()];
            if (p && p.mastered) mastered++;
        });
        let dot = btn.querySelector('.progress-dot');
        if (!dot) {
            dot = document.createElement('span');
            dot.className = 'progress-dot';
            btn.appendChild(dot);
        }
        if (total === 0) { dot.className = 'progress-dot empty'; return; }
        const rate = mastered / total;
        if (rate >= 0.9) dot.className = 'progress-dot complete';
        else if (rate > 0) dot.className = 'progress-dot partial';
        else dot.className = 'progress-dot empty';
    });
}

function renderWordList() {
    const table = document.getElementById('wordlistTable');
    const progress = loadProgress();
    let html = `<table>`;
    wordList.forEach(w => {
        const p = progress[w.en] || { mastered: false, correct: 0 };
        const dot = p.mastered ? '●' : '○';
        const color = p.mastered ? '#2b7a4b' : '#c0c8d6';
        const posTag = w.pos ? `<span class="pos-tag">${w.pos}</span>` : '';
        html += `<tr><td class="en">${w.en}</td><td class="ipa">${w.ipa || ''}</td><td class="zh">${posTag}${w.zh}</td><td style="text-align:center;color:${color};">${dot}</td></tr>`;
    });
    html += `</table>`;
    table.innerHTML = html;
}

// ======================== 初始化 ========================
function initLessonBar() {
    const bar = document.getElementById('lessonBar');
    const lessons = Object.keys(RAW_LESSONS).map(Number).sort((a,b)=>a-b);
    lessons.forEach(l => {
        const btn = document.createElement('button');
        btn.className = 'lesson-btn' + (l === currentLesson ? ' active' : '');
        btn.textContent = `L${l}`;
        btn.dataset.lesson = l;
        btn.addEventListener('click', function() {
            document.querySelectorAll('.lesson-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            loadLesson(Number(this.dataset.lesson));
        });
        bar.appendChild(btn);
    });
    updateLessonDots();
}

function initModeTabs() {
    document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentMode = this.dataset.mode;
            answered = false;
            render();
            document.getElementById('extraArea').innerHTML = '';
        });
    });
}

document.getElementById('nextBtn').addEventListener('click', nextQuestion);
document.getElementById('shuffleBtn').addEventListener('click', function() {
    shuffled = shuffleArray([...wordList]);
    currentIndex = 0;
    stats = { correct: 0, wrong: 0, total: 0 };
    answered = false;
    render();
    updateStat();
});
document.getElementById('resetBtn').addEventListener('click', function() {
    if (!confirm('重置当前课所有单词的学习进度？')) return;
    const progress = loadProgress();
    wordList.forEach(w => { delete progress[w.en]; });
    saveProgress(progress);
    loadLesson(currentLesson);
});
document.getElementById('resetAllBtn').addEventListener('click', function() {
    if (!confirm('⚠️ 确定要删除所有学习进度吗？此操作不可撤销！')) return;
    localStorage.removeItem(STORAGE_KEY);
    loadLesson(currentLesson);
});

if (window.speechSynthesis) {
    speechSynthesis.getVoices();
}

initLessonBar();
initModeTabs();
loadLesson(1);
</script>
